---
# Deliberately minimal / permissive baseline. This is the "vulnerable" posture you
# exploit during the demo. The hardened/ overlay is what you switch to afterwards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v17.1.1
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              # 'unsafe' re-enables challenges/features disabled by default; good for a lab.
              value: "unsafe"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
  annotations:
    # Plain LoadBalancer uses the in-tree cloud provider and gets you a public
    # Classic ELB with zero extra components — reliable for a demo. For a
    # production-grade NLB/ALB, install the AWS Load Balancer Controller (Helm)
    # and switch to type "external" annotations or an Ingress (see README).
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: juice-shop
  ports:
    - name: http
      port: 80
      targetPort: 3000
