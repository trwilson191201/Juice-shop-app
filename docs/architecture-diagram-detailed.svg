<rect x="28" y="768" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="46" y="778" text-anchor="start" font-size="11" fill="#5F5E5A">external threat</text>
<rect x="150" y="768" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="168" y="778" text-anchor="start" font-size="11" fill="#5F5E5A">AWS entry / managed</text>
<rect x="310" y="768" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="328" y="778" text-anchor="start" font-size="11" fill="#5F5E5A">app component / workload</text>
<rect x="490" y="768" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="508" y="778" text-anchor="start" font-size="11" fill="#5F5E5A">network / infra</text>
<circle cx="636" cy="774" r="7" fill="#FDF1E3" stroke="#C2410C" stroke-width="1"/><text x="650" y="778" text-anchor="start" font-size="11" fill="#5F5E5A">vulnerability</text>

<!-- Legend: vulns -->
<text x="28" y="800" text-anchor="start" font-size="11" fill="#7C2D12"><tspan font-weight="700">1 · A03 Injection</tspan> — login builds SQL by string concatenation → auth bypass, full DB read</text>
<text x="28" y="818" text-anchor="start" font-size="11" fill="#7C2D12"><tspan font-weight="700">2 · A01 Broken Access Control</tspan> — GET /rest/basket/:id checks authn but not ownership → IDOR, enumerable</text>
<text x="28" y="836" text-anchor="start" font-size="11" fill="#7C2D12"><tspan font-weight="700">3 · A05 Security Misconfiguration</tspan> — /ftp/* served publicly, admin route exposed, verbose errors</text>
</svg>
