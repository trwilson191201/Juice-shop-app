<svg width="680" height="665" viewBox="0 0 680 665" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
<title>EKS security lab topology</title>
<desc>An attacker laptop reaches a public load balancer over HTTP, which forwards to the Juice Shop pod running in a private subnet inside an EKS node group, with an AWS-managed control plane.</desc>
<style>
  .t  { font-size:14px; fill:#2C2C2A; }
  .ts { font-size:12px; fill:#5F5E5A; }
  .th { font-size:14px; font-weight:500; fill:#2C2C2A; }
  .arr { stroke:#888780; stroke-width:1.5; fill:none; }
  .dash { fill:none; stroke:#B4B2A9; stroke-width:0.5; stroke-dasharray:4 3; }
  .solid { fill:none; stroke:#888780; stroke-width:0.5; }
  .coral rect { fill:#FAECE7; stroke:#993C1D; stroke-width:0.5; }
  .coral .th { fill:#712B13; } .coral .ts { fill:#993C1D; }
  .blue rect  { fill:#E6F1FB; stroke:#185FA5; stroke-width:0.5; }
  .blue .th { fill:#0C447C; } .blue .ts { fill:#185FA5; }
  .teal rect  { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.5; }
  .teal .th { fill:#04342C; } .teal .ts { fill:#0F6E56; }
  .gray rect  { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:0.5; }
  .gray .th { fill:#2C2C2A; } .gray .ts { fill:#444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="665" fill="#FFFFFF"/>

<g class="coral"><rect x="400" y="45" width="180" height="40" rx="8"/><text class="th" x="490" y="62" text-anchor="middle">Attacker</text><text class="ts" x="490" y="77" text-anchor="middle">demo laptop + curl</text></g>

<rect class="dash" x="40" y="105" width="600" height="511" rx="8"/>
<text class="ts" x="56" y="125" text-anchor="start">AWS account · us-east-1</text>

<g class="blue"><rect x="56" y="140" width="210" height="40" rx="6"/><text class="th" x="161" y="158" text-anchor="middle">EKS control plane</text><text class="ts" x="161" y="173" text-anchor="middle">AWS-managed API server</text></g>

<rect class="dash" x="56" y="195" width="580" height="409" rx="8"/>
<text class="ts" x="70" y="214" text-anchor="start">Lab VPC · 10.0.0.0/16</text>

<rect class="dash" x="74" y="228" width="548" height="94" rx="8"/>
<text class="ts" x="86" y="246" text-anchor="start">Public subnets · 2 AZs</text>
<g class="gray"><rect x="92" y="262" width="170" height="46" rx="6"/><text class="th" x="177" y="289" text-anchor="middle">NAT gateway</text></g>
<g class="blue"><rect x="410" y="262" width="160" height="46" rx="6"/><text class="th" x="490" y="282" text-anchor="middle">Public ELB</text><text class="ts" x="490" y="298" text-anchor="middle">internet-facing</text></g>

<rect class="dash" x="74" y="335" width="548" height="257" rx="8"/>
<text class="ts" x="86" y="353" text-anchor="start">Private subnets · 2 AZs</text>

<rect class="solid" x="92" y="366" width="512" height="214" rx="8"/>
<text class="ts" x="104" y="385" text-anchor="start">EKS node group · 2× t3.medium</text>

<rect class="dash" x="236" y="400" width="312" height="160" rx="8"/>
<text class="ts" x="248" y="416" text-anchor="start">juice-shop</text>
<g class="teal"><rect x="300" y="430" width="184" height="72" rx="6"/><text class="th" x="392" y="454" text-anchor="middle">Juice Shop pod</text><text class="ts" x="392" y="472" text-anchor="middle">bkimminich/juice-shop</text><text class="ts" x="392" y="488" text-anchor="middle">v17.1.1 · port 3000</text></g>

<line class="arr" x1="490" y1="85" x2="490" y2="260" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="175" text-anchor="start">HTTP :80</text>
<path class="arr" d="M490 308 L490 358 L392 358 L392 428" marker-end="url(#arrow)"/>
<text class="ts" x="400" y="350" text-anchor="start">:3000</text>

<rect x="90" y="636" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="108" y="646" text-anchor="start">external threat</text>
<rect x="240" y="636" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text class="ts" x="258" y="646" text-anchor="start">AWS entry / managed</text>
<rect x="420" y="636" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="438" y="646" text-anchor="start">workload</text>
<rect x="520" y="636" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="538" y="646" text-anchor="start">network / infra</text>
</svg>
