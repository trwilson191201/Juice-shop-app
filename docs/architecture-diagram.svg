<svg width="680" height="665" viewBox="0 0 680 665" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
<title>EKS security lab topology</title>
<desc>An attacker laptop reaches a public load balancer over HTTP, which forwards to the Juice Shop pod running in a private subnet inside an EKS node group, with an AWS-managed control plane.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="665" fill="#FFFFFF"/>

<rect x="400" y="45" width="180" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="62" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Attacker</text>
<text x="490" y="77" text-anchor="middle" font-size="12" fill="#993C1D">demo laptop + curl</text>

<rect x="40" y="105" width="600" height="511" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="56" y="125" text-anchor="start" font-size="12" fill="#5F5E5A">AWS account · us-east-1</text>

<rect x="56" y="140" width="210" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="161" y="158" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">EKS control plane</text>
<text x="161" y="173" text-anchor="middle" font-size="12" fill="#185FA5">AWS-managed API server</text>

<rect x="56" y="195" width="580" height="409" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="70" y="214" text-anchor="start" font-size="12" fill="#5F5E5A">Lab VPC · 10.0.0.0/16</text>

<rect x="74" y="228" width="548" height="94" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="86" y="246" text-anchor="start" font-size="12" fill="#5F5E5A">Public subnets · 2 AZs</text>
<rect x="92" y="262" width="170" height="46" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="177" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">NAT gateway</text>
<rect x="410" y="262" width="160" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="490" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Public ELB</text>
<text x="490" y="298" text-anchor="middle" font-size="12" fill="#185FA5">internet-facing</text>

<rect x="74" y="335" width="548" height="257" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="86" y="353" text-anchor="start" font-size="12" fill="#5F5E5A">Private subnets · 2 AZs</text>

<rect x="92" y="366" width="512" height="214" rx="8" fill="none" stroke="#888780" stroke-width="0.5"/>
<text x="104" y="385" text-anchor="start" font-size="12" fill="#5F5E5A">EKS node group · 2× t3.medium</text>

<rect x="236" y="400" width="312" height="160" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="248" y="416" text-anchor="start" font-size="12" fill="#5F5E5A">juice-shop</text>
<rect x="300" y="430" width="184" height="72" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="392" y="454" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Juice Shop pod</text>
<text x="392" y="472" text-anchor="middle" font-size="12" fill="#0F6E56">bkimminich/juice-shop</text>
<text x="392" y="488" text-anchor="middle" font-size="12" fill="#0F6E56">v17.1.1 · port 3000</text>

<line x1="490" y1="85" x2="490" y2="260" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="500" y="175" text-anchor="start" font-size="12" fill="#5F5E5A">HTTP :80</text>
<path d="M490 308 L490 358 L392 358 L392 428" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="400" y="350" text-anchor="start" font-size="12" fill="#5F5E5A">:3000</text>

<rect x="90" y="636" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="108" y="646" text-anchor="start" font-size="12" fill="#5F5E5A">external threat</text>
<rect x="240" y="636" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="258" y="646" text-anchor="start" font-size="12" fill="#5F5E5A">AWS entry / managed</text>
<rect x="420" y="636" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="438" y="646" text-anchor="start" font-size="12" fill="#5F5E5A">workload</text>
<rect x="520" y="636" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="538" y="646" text-anchor="start" font-size="12" fill="#5F5E5A">network / infra</text>
</svg>
